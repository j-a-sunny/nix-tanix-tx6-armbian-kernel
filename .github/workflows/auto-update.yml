name: Auto-update Armbian kernel pin

on:
  workflow_dispatch:
  schedule:
    # Daily at 06:00 UTC — adjust to taste
    - cron: '0 6 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check for a newer Armbian kernel
        run: nix run .#update-sources

      - name: Verify the new pin actually builds
        run: nix build .#armbian-kernel-tanix-tx6 -L

      - name: Commit sources.nix if it changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Update Armbian kernel pin'
          file_pattern: sources.nix
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
